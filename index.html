    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Instalar como app (PWA): ícono, color de fondo y modo "standalone" -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS no lee manifest.json para el ícono ni el modo pantalla completa:
         necesita estas etiquetas propias además del manifest de arriba. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="DREY" />
